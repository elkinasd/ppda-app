    <!-- STATE 1: DOCUMENTS READY TO PROCESS (Actionable State) -->
    <div class="text-center mb-5 w-100 mt-5 mt-md-0" style="max-width: 800px;" *ngIf="detectedDocumentsCount > 0">
      
      <!-- Actionable Icon -->
      <div class="ai-brain-container mx-auto mb-4 d-flex justify-content-center align-items-center">
        <div class="pulse-ring border-primary opacity-50"></div>
        <div class="ai-core bg-primary bg-opacity-10 border border-primary text-primary d-flex justify-content-center align-items-center shadow-primary flex-column">
          <!-- Animated document entering a system -->
          <i class="bi bi-file-earmark-arrow-down fs-1 position-relative" style="top: -2px;"></i>
        </div>
      </div>
      
      <!-- Clear, sales-driven title -->
      <h1 class="fw-bold text-white mb-3 text-shadow-glow display-5 display-md-3" style="letter-spacing: -2px;">
        {{detectedDocumentsCount}} documentos listos para automatizar
      </h1>
      
      <!-- Direct Subtitle -->
      <p class="fs-5 fs-md-4 text-white-50 fw-light mx-auto mb-4 px-2">
        Detectamos documentos en tus bandejas. Quítate este trabajo de encima ahora mismo.
      </p>

      <!-- Document Types Breakdown (Crucial context for the business) -->
      <div class="d-flex justify-content-center flex-wrap gap-2 mb-5">
        <span *ngFor="let type of documentTypes" class="badge bg-white bg-opacity-10 border border-secondary border-opacity-50 text-light px-3 py-2 rounded-3 d-flex align-items-center gap-2 font-monospace" style="font-size: 0.85rem;">
          <i class="bi {{type.icon}} {{type.color}}"></i> 
          {{type.name}} <span class="badge bg-dark ms-1">{{type.count}}</span>
        </span>
      </div>

      <!-- Human Action Button -->
      <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">
        <button class="btn btn-primary btn-cta text-white fw-bold px-5 py-3 rounded-pill d-flex align-items-center justify-content-center gap-2 hover-scale fs-5" (click)="startAutomation.emit()">
          <i class="bi bi-lightning-charge-fill"></i>
          Automatizar estos documentos
        </button>
        <button class="btn btn-outline-light text-white border-opacity-25 fw-medium px-4 py-3 rounded-pill glass-button hover-scale" (click)="reviewDocuments.emit()" title="Ver los archivos pendientes manualmente">
          Revisar Documentos <i class="bi bi-arrow-right ms-2"></i>
        </button>
      </div>
    </div>

    <!-- STATE 2: ZERO DOCUMENTS (Inbox Zero / Relaxed State) -->
    <div class="text-center mb-5 w-100" style="max-width: 800px;" *ngIf="detectedDocumentsCount === 0">
      
      <!-- Calm Icon: Checkmark showing nothing to do -->
      <div class="ai-brain-container mx-auto mb-4 d-flex justify-content-center align-items-center">
        <!-- Inner glow instead of aggressive pulse -->
        <div class="ai-core bg-success bg-opacity-10 border border-success border-opacity-50 text-success d-flex justify-content-center align-items-center flex-column" style="box-shadow: 0 0 30px rgba(25, 135, 84, 0.2);">
          <i class="bi bi-check2-all fs-1 position-relative"></i>
        </div>
      </div>
      
      <!-- Relaxed, reassuring title -->
      <h1 class="display-3 fw-bold text-white mb-2" style="letter-spacing: -2px;">
        Todo está al día
      </h1>
      
      <!-- Reassuring Subtitle -->
      <p class="fs-4 text-white-50 fw-light mx-auto mb-5">
        No hay documentos nuevos pendientes de procesar.<br>Tómate un café, la IA sigue vigilando tus canales.
      </p>

      <!-- Soft Secondary Action -->
      <div class="d-flex justify-content-center">
        <button class="btn btn-outline-light text-white-50 border-opacity-25 fw-medium px-4 py-2 rounded-pill glass-button hover-scale d-flex align-items-center gap-2" (click)="refreshDocuments.emit()">
          <i class="bi bi-arrow-clockwise"></i> Buscar nuevos archivos
        </button>
      </div>
    </div>
